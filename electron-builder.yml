appId: org.purehearts.electronstarter
productName: Electron Starter
asar: true
protocols:
  - name: Electron Starter Links
    schemes:
      - electron-starter
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources
    to: resources
publish:
  provider: github
  owner: pure-hearts
  repo: electron-starter
win:
  icon: resources/icons/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: resources/icons/icon.png
  target: [dmg, zip]
linux:
  icon: resources/icons/icon.png
  target: [AppImage, deb]
  category: Utility
  syncDesktopName: true
