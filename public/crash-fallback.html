<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面异常退出 - 恢复助手</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: rgba(22, 30, 49, 0.85);
        --border: rgba(255, 255, 255, 0.1);
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #ef4444;
        --danger-bg: rgba(239, 68, 68, 0.12);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        background-image:
          radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        user-select: none;
      }
      .container {
        background: var(--card-bg);
        border: 1px solid var(--border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 16px;
        padding: 40px;
        max-width: 540px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        text-align: center;
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .icon-wrapper {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--danger-bg);
        border: 1px solid rgba(239, 68, 68, 0.25);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: var(--danger);
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }
      p.desc {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .detail-box {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        padding: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        color: #cbd5e1;
        text-align: left;
        margin-bottom: 28px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .detail-row {
        display: flex;
        justify-content: space-between;
      }
      .detail-label {
        color: var(--text-muted);
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      button {
        padding: 10px 22px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        outline: none;
      }
      .btn-primary {
        background: var(--primary);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-wrapper">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>
      <h1>渲染进程意外终止</h1>
      <p class="desc">
        应用页面遇到了未预期的错误并已安全中止。您可以点击下方按钮尝试重新加载当前视图。
      </p>

      <div class="detail-box">
        <div class="detail-row">
          <span class="detail-label">终止原因 (Reason):</span>
          <span id="crash-reason">crashed</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">退出代码 (Exit Code):</span>
          <span id="crash-code">-1</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="handleReload()">重新加载应用</button>
        <button class="btn-secondary" onclick="handleQuit()">关闭应用</button>
      </div>
    </div>

    <script>
      // 从 URL 查询参数提取崩溃原因
      const params = new URLSearchParams(window.location.search);
      const reason = params.get("reason") || "crashed";
      const code = params.get("code") || "-1";

      document.getElementById("crash-reason").textContent = reason;
      document.getElementById("crash-code").textContent = code;

      function handleReload() {
        if (window.$ipcBridge && typeof window.$ipcBridge.invoke === "function") {
          window.$ipcBridge.invoke("app:restart").catch(() => {
            window.location.href = window.location.origin + "/";
          });
        } else {
          window.location.href = window.location.origin + "/";
        }
      }

      function handleQuit() {
        if (window.$ipcBridge) {
          window.$ipcBridge.invoke("app:quit").catch(() => window.close());
        } else {
          window.close();
        }
      }
    </script>
  </body>
</html>
