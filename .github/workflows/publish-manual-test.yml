# 手动验收专用：从成功的历史构建复制未签名安装包，创建预发布版。
# 与 release.yml 的正式签名发布不同，不能用于生产分发。
name: Publish unsigned manual test release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-manual-test.yml
  workflow_dispatch:
permissions:
  # 需要创建 GitHub Release，另需读取之前 Actions 产物。
  contents: write
  actions: read
jobs:
  # 仅允许在指定仓库运行，防止 Fork 意外触发该仓库的发布流程。
  publish:
    if: github.repository == 'pure-hearts/electron-starter'
    runs-on: ubuntu-latest
    steps:
      # 从指定成功构建下载三平台安装包，避免再次构建出现版本差异。
      - name: Fetch three-platform artifacts from successfully verified build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 39442467032 --repo "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion + " " + .headSha' | grep -Fx 'success d65822e39761819c2401aa5a50ca92a07999e04e'
          mkdir -p artifacts dist
          gh run download 39442467032 --repo "$GITHUB_REPOSITORY" --dir artifacts
          for platform in windows macos ubuntu; do
            test -d "artifacts/test-package-${platform}-latest" || { echo "Missing $platform artifact"; exit 1; }
          done
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            test ! -e "dist/$name" || { echo "Duplicate installer $name"; exit 1; }
            cp "$file" "dist/$name"
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          test "$(find dist -type f | wc -l)" -ge 5 || { echo "Incomplete installer set"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/
      # 创建带有未签名警告的 Pre-release，供测试设备手动下载安装。
      - name: Publish pre-release for manual installation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="manual-test-20261020"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target d65822e39761819c2401aa5a50ca92a07999e04e \
            --title "Unsigned manual verification build (2026-10-20)" \
            --prerelease \
            --notes "UNSIGNED TEST BUILD — NOT A PRODUCTION RELEASE. Assets are copied from successful three-platform CI build 39442467032 at commit d65822e. Download the installer matching your OS, verify SHA256SUMS.txt, and test install/launch/upgrade only in a controlled environment. Windows SmartScreen and macOS Gatekeeper may warn because these binaries are not signed/notarized. Automated build success does not establish real hardware acceptance."
