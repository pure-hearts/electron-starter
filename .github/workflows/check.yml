name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Source checks
        run: pnpm exec vp check
      - name: Test
        run: pnpm exec vp test --run
      - name: Build
        run: pnpm exec vp build
      - name: Configure sandbox helper on Linux CI
        run: |
          ELECTRON_BIN="$(node -p "require('electron')" | tail -n 1)"
          SANDBOX="$(dirname "$ELECTRON_BIN")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
      - name: Electron runtime smoke
        run: xvfb-run -a node scripts/smoke.mjs
      - name: Portable Linux package check
        run: pnpm exec electron-builder --linux dir --publish never
      - name: Packaged Electron smoke
        run: |
          PACKAGED_BIN="release/linux-unpacked/electron-starter"
          test -x "$PACKAGED_BIN"
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          ELECTRON_STARTER_SMOKE=1 xvfb-run -a "$PACKAGED_BIN"
      - name: Upload portable Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-directory
          path: release/linux-unpacked/
          retention-days: 7
      - name: Commit missing lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: lock verified pnpm dependencies"
            git push origin HEAD:main
          fi
