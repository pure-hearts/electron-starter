# 正式签名发布流程：只接受 v* 版本标签，要求真实发布身份及签名凭据。
name: Signed Release
on:
  push:
    tags: ["v*"]
permissions:
  # 正式发行必须创建 Release 并上传资产，因此使用 contents:write。
  contents: write

jobs:
  # 发布前先做阻断式检查，失败时不进入三平台打包步骤。
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 标签名必须与 package.json 的版本严格一致，例如 v0.1.0。
      - name: Validate tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "::error::Tag must exactly match package.json version"; exit 1; }
      # 拒绝仍使用模板邮箱或演示 App ID 的生产发行。
      - name: Reject placeholder publisher identity
        run: node scripts/assert-publisher-identity.mjs
      # 缺少 Windows 证书或 Apple Developer 签名、公证信息时禁止发布。
      - name: Require code-signing and notarization secrets
        shell: bash
        env:
          WIN_SIGN_CERT: ${{ secrets.WIN_CSC_LINK }}
          WIN_SIGN_PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_SIGN_CERT: ${{ secrets.MAC_CSC_LINK }}
          MAC_SIGN_PASS: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for VAR in WIN_SIGN_CERT WIN_SIGN_PASS MAC_SIGN_CERT MAC_SIGN_PASS APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Required release secret $VAR is missing; unsigned production releases are prohibited"
              exit 1
            fi
          done

  # 前置检查通过后在不同操作系统构建，并从 GitHub Secrets 注入凭据。
  package:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: dist:win
          - os: macos-latest
            task: dist:mac
          - os: ubuntu-latest
            task: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '') }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || (matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '') }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Source checks
        run: pnpm exec vp check
      - name: Vue type check
        run: pnpm exec vue-tsc --noEmit
      - name: Unit tests
        run: pnpm exec vp test --run
      # 生成正式构建产物；生产验收仍需检查实际签名与公证结果。
      - name: Build signed installers
        run: pnpm run ${{ matrix.task }}
      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  # 收集各平台产物并发布到与版本标签对应的 GitHub Release。
  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
